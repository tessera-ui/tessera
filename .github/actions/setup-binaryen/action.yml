name: Set up Binaryen
description: Install the Binaryen optimizer for Web release builds
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        repo=WebAssembly/binaryen
        tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
        archive="binaryen-$tag-x86_64-linux.tar.gz"
        cd "$RUNNER_TEMP"
        gh release download "$tag" --repo "$repo" --pattern "$archive" --pattern "$archive.sha256"
        sha256sum -c "$archive.sha256"
        tar -xzf "$archive"
        echo "$RUNNER_TEMP/binaryen-$tag/bin" >> "$GITHUB_PATH"
