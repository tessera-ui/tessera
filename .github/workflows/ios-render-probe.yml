name: iOS render probe
on:
  push:
    branches: [codex/ios-render-probe]
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      TESSERA_COLOR_CHECK_TIMEOUT_SECS: 900
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build iOS app
        run: cargo tessera ios build -p example --profiling-output acceptance.jsonl
      - name: Run and capture iOS example
        run: python3 scripts/test-apple-ime.py target/packages/example/ios/*/example.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-render-probe
          path: target/mobile-acceptance/
