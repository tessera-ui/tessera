name: Pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      # The squashed commit on main takes this title, and the release script
      # reads its type and breaking-change marker.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert|release)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Use a Conventional Commits title, such as 'fix(cargo-tessera): ...'; got: $TITLE"
            exit 1
          fi
