name: Verify Nix shells

on:
  push:
    branches:
      - diag/nix

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git -C crates/tessera-cosmic-text lfs pull
      - name: Free space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Lock inputs
        run: nix flake update
      - name: Android shell tools
        run: |
          nix develop .#android --command bash -c '
            set -e
            java -version
            echo "$ANDROID_HOME" "$ANDROID_SDK_ROOT"
            ls "$ANDROID_NDK_HOME"
            ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
            ls "$(rustc --print sysroot)/lib/rustlib"
          '
      - name: Android build
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          (while true; do date +%T; free -m | sed -n 2p; df -h / | tail -1; sleep 60; done) &
          timeout 40m nix develop .#android --command bash -c '
            cargo run -p cargo-tessera -- tessera android build --format apk -p example --arch arm64
          '
