name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  TESSERA_COLOR_CHECK_TIMEOUT_SECS: 900

jobs:
  build_and_test:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, rust-src, rust-analyzer
          target: wasm32-unknown-unknown
      - name: Check all targets
        run: cargo tessera check --workspace --all-targets --verbose
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,rust-script,cargo-packager
      - name: Test and package example
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
          export XDG_RUNTIME_DIR="$RUNNER_TEMP"
          cargo nextest run --workspace --run-ignored all --no-fail-fast --test-threads 2
          cargo test --workspace --doc
          rust-script scripts/release-package.rs --check
          cargo tessera package -p example --formats deb
      - name: Check scripts and formatting
        if: runner.os == 'Linux'
        run: |
          rust-script --test scripts/analyze-profiler.rs
          rust-script --test scripts/check-imports.rs
          rust-script --test scripts/release-package.rs
          rust-script scripts/check-imports.rs --check
      - name: Test and package Windows example
        if: runner.os == 'Windows'
        run: |
          cargo test -p tessera-ui -p tessera-components --lib
          cargo tessera package -p example --formats nsis
      - name: Package example and verify Apple IME
        if: runner.os == 'macOS'
        run: |
          cargo tessera ios build -p example --profiling-output acceptance.jsonl
          cargo tessera package -p example --formats app
          python3 scripts/test-apple-ime.py target/packages/example/ios/*/example.app

  check_web:
    name: Check Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
          target: wasm32-unknown-unknown
      - name: Install Binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build web example
        run: cargo tessera web build --release -p example

  check_android:
    name: Check Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
          target: aarch64-linux-android,x86_64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
      - name: Build Android example
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tessera android build --format apk -p example --arch arm64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android example
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cargo tessera android build --format apk -p example --arch x86_64 --profiling-output files/acceptance.jsonl
            python3 scripts/check-mobile.py --android example/gen/android/app/build/outputs/apk
