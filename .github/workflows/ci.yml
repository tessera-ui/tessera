name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  TESSERA_COLOR_CHECK_TIMEOUT_SECS: 900

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git -C crates/tessera-cosmic-text lfs pull
      - uses: tessera-ui/setup-tessera@v1.0.1
        with:
          tessera-version: workspace
      - name: Check all targets
        run: cargo tessera check --workspace --all-targets --verbose
      - name: Run tests
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: cargo nextest run --workspace --no-fail-fast

  render:
    name: Render tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git -C crates/tessera-cosmic-text lfs pull
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: tessera-ui/setup-tessera@v1.0.1
        with:
          tessera-version: workspace
      - name: Run GPU tests with software Vulkan
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: >
          cargo nextest run --workspace --run-ignored only --no-fail-fast
          --test-threads 2 --partition hash:${{ matrix.shard }}/3

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb,appimage,pacman
            checks: deb appimage pacman
          - os: windows-latest
            formats: nsis,wix
            checks: windows msi
          - os: macos-latest
            formats: app,dmg
            checks: macos dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: tessera-ui/setup-tessera@v1.0.1
        with:
          tessera-version: workspace
      - name: Verify packaged sources and scaffolds
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: rust-script scripts/release-package.rs --check
      - name: Package the example
        env:
          # Run AppImage tools without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo tessera package -p example --formats ${{ matrix.formats }}
      - name: Inspect the packages
        shell: bash
        run: |
          for check in ${{ matrix.checks }}; do
            artifact=target/packages/example
            if [ "$check" = macos ]; then artifact=$(echo target/packages/example/*.app); fi
            rust-script scripts/check-package.rs "$check" "$artifact"
          done

  scripts:
    name: Scripts, doctests and formatting
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git -C crates/tessera-cosmic-text lfs pull
      - uses: tessera-ui/setup-tessera@v1.0.1
        with:
          tessera-version: workspace
          platforms: host
          tools: rust-script
      - name: Test scripts
        run: |
          for script in $(grep -l '^fn main' scripts/*.rs); do
            rust-script --test "$script"
          done
      - name: Check imports and formatting
        run: rust-script scripts/check-imports.rs --check
      - name: Run doctests
        run: cargo test --workspace --doc
      - name: Build documentation
        run: cargo doc --workspace --exclude tessera-cosmic-text --no-deps

  check_minimal_versions:
    name: Check minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: false
      - name: Isolate library dependency floors from the CLI
        run: sed -i '/^    "crates\/cargo-tessera",$/d' Cargo.toml
      - name: Resolve direct dependencies to their minimum versions
        run: cargo +nightly update -Z direct-minimal-versions
      - name: Check all targets
        run: cargo +nightly check --workspace --all-targets --locked

  check_web:
    name: Check Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: tessera-ui/setup-tessera@v1.0.1
        with:
          tessera-version: workspace
      - name: Build and inspect the Web example
        run: |
          cargo tessera web build --release -p example
          rust-script scripts/check-package.rs web example/gen/web
          node scripts/check-web-wasm.mjs example/gen/web/pkg-web/example_lib_bg.wasm

  check_ios:
    name: Check iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: tessera-ui/setup-tessera@v1.0.1
        with:
          tessera-version: workspace
          platforms: host,web,ios
          tools: rust-script
      - name: Build and inspect the iOS Simulator example
        run: |
          cargo tessera apple init -p example --force
          cargo tessera ios build -p example --profiling-output acceptance.jsonl
          rust-script scripts/check-package.rs ios target/packages/example/ios/*/example.app
      - name: Build the macOS target of the Xcode project
        run: >-
          xcodebuild -project example/gen/apple/example.xcodeproj
          -scheme example-macOS -configuration Debug
          -derivedDataPath target/xcode build
      - name: Verify Apple IME and iOS application lifecycle
        run: rust-script scripts/test-apple-ime.rs target/packages/example/ios/*/example.app
      - name: Retain iOS acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-acceptance-diagnostics
          path: target/mobile-acceptance
          if-no-files-found: ignore

  check_android:
    name: Check Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: tessera-ui/setup-tessera@v1.0.1
        with:
          tessera-version: workspace
          platforms: host,web,android
          tools: rust-script
      - name: Build and inspect Android APKs
        run: |
          cargo tessera android build --format apk -p example --arch arm64
          rust-script scripts/check-package.rs android example/gen/android/app/build/outputs/apk
          cargo tessera android build --format apk -p example --arch x86_64 --profiling-output files/acceptance.jsonl
          rust-script scripts/check-package.rs android example/gen/android/app/build/outputs/apk
          cargo tessera android build --format aab -p example --arch arm64
          rust-script scripts/check-package.rs aab example/gen/android/app/build/outputs/bundle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android example
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: rust-script scripts/check-mobile.rs --android example/gen/android/app/build/outputs/apk
      - name: Retain Android acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-acceptance-diagnostics
          path: target/mobile-acceptance
          if-no-files-found: ignore
