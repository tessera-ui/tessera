name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  TESSERA_COLOR_CHECK_TIMEOUT_SECS: 900

jobs:
  build_and_test:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, rust-src, rust-analyzer
          target: wasm32-unknown-unknown
      - name: Check all targets
        run: cargo tessera check --workspace --all-targets --verbose
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,rust-script,cargo-packager
      - name: Test and package example
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
          export XDG_RUNTIME_DIR="$RUNNER_TEMP"
          git -C crates/tessera-cosmic-text lfs pull
          cargo nextest run --workspace --run-ignored all --no-fail-fast --test-threads 2
          cargo test --workspace --doc
          rust-script scripts/release-package.rs --check
          cargo tessera package -p example --formats deb
          rust-script scripts/check-package.rs deb target/packages/example
      - name: Check scripts and formatting
        if: runner.os == 'Linux'
        run: |
          rust-script --test scripts/check-mobile.rs
          rust-script --test scripts/check-package.rs
          rust-script --test scripts/test-apple-ime.rs
          rust-script --test scripts/analyze-profiler.rs
          rust-script --test scripts/check-imports.rs
          rust-script --test scripts/release-package.rs
          rust-script scripts/check-imports.rs --check
      - name: Test and package Windows example
        if: runner.os == 'Windows'
        run: |
          cargo test -p tessera-ui -p tessera-components --lib
          cargo tessera package -p example --formats nsis
      - name: Inspect the Windows installer
        if: runner.os == 'Windows'
        run: rust-script scripts/check-package.rs windows target/packages/example
      - name: Package and inspect the macOS example
        if: runner.os == 'macOS'
        run: |
          cargo tessera package -p example --formats app
          rust-script scripts/check-package.rs macos target/packages/example/*.app
      - name: Package and inspect the iOS Simulator example
        if: runner.os == 'macOS'
        run: |
          cargo tessera ios build -p example --profiling-output acceptance.jsonl
          rust-script scripts/check-package.rs ios target/packages/example/ios/*/example.app
      - name: Verify Apple IME and iOS application lifecycle
        if: runner.os == 'macOS'
        run: |
          rust-script scripts/test-apple-ime.rs target/packages/example/ios/*/example.app
      - name: Retain iOS acceptance diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ios-acceptance-diagnostics
          path: target/mobile-acceptance
          if-no-files-found: ignore

  check_minimal_versions:
    name: Check minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: false
      - name: Resolve direct dependencies to their minimum versions
        run: cargo +nightly update -Z direct-minimal-versions
      - name: Check all targets
        run: cargo +nightly check --workspace --all-targets --locked

  check_web:
    name: Check Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
          target: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-binaryen
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      - name: Build and inspect the Web example
        run: |
          cargo tessera web build --release -p example
          rust-script scripts/check-package.rs web example/gen/web
          node scripts/check-web-wasm.mjs example/gen/web/pkg-web/example_lib_bg.wasm

  check_android:
    name: Check Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
          target: aarch64-linux-android,x86_64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      - name: Build and inspect Android APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo tessera android build --format apk -p example --arch arm64
          rust-script scripts/check-package.rs android example/gen/android/app/build/outputs/apk
          cargo tessera android build --format apk -p example --arch x86_64 --profiling-output files/acceptance.jsonl
          rust-script scripts/check-package.rs android example/gen/android/app/build/outputs/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android example
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: rust-script scripts/check-mobile.rs --android example/gen/android/app/build/outputs/apk
      - name: Retain Android acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-acceptance-diagnostics
          path: target/mobile-acceptance
          if-no-files-found: ignore
