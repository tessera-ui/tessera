name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  TESSERA_COLOR_CHECK_TIMEOUT_SECS: 900

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git -C crates/tessera-cosmic-text lfs pull
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, rust-src, rust-analyzer
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Check all targets
        run: cargo tessera check --workspace --all-targets --verbose
      - name: Run tests
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: cargo nextest run --workspace --no-fail-fast

  render:
    name: Render tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git -C crates/tessera-cosmic-text lfs pull
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run GPU tests with software Vulkan
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: >
          cargo nextest run --workspace --run-ignored only --no-fail-fast
          --test-threads 2 --partition hash:${{ matrix.shard }}/3

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            format: deb
            platform: deb
            artifact: target/packages/example
          - os: windows-latest
            format: nsis
            platform: windows
            artifact: target/packages/example
          - os: macos-latest
            format: app
            platform: macos
            artifact: target/packages/example/*.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script,cargo-packager
      - name: Verify packaged sources and scaffolds
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: rust-script scripts/release-package.rs --check
      - name: Package the example
        run: cargo tessera package -p example --formats ${{ matrix.format }}
      - name: Inspect the package
        run: rust-script scripts/check-package.rs ${{ matrix.platform }} ${{ matrix.artifact }}

  scripts:
    name: Scripts, doctests and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git -C crates/tessera-cosmic-text lfs pull
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      - name: Test scripts
        run: |
          for script in $(grep -l '^fn main' scripts/*.rs); do
            rust-script --test "$script"
          done
      - name: Check imports and formatting
        run: rust-script scripts/check-imports.rs --check
      - name: Run doctests
        run: cargo test --workspace --doc

  check_minimal_versions:
    name: Check minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: false
      - name: Isolate library dependency floors from the CLI
        run: sed -i '/^    "crates\/cargo-tessera",$/d' Cargo.toml
      - name: Resolve direct dependencies to their minimum versions
        run: cargo +nightly update -Z direct-minimal-versions
      - name: Check all targets
        run: cargo +nightly check --workspace --all-targets --locked

  check_web:
    name: Check Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
          target: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-binaryen
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      - name: Build and inspect the Web example
        run: |
          cargo tessera web build --release -p example
          rust-script scripts/check-package.rs web example/gen/web
          node scripts/check-web-wasm.mjs example/gen/web/pkg-web/example_lib_bg.wasm

  check_ios:
    name: Check iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      - name: Build and inspect the iOS Simulator example
        run: |
          cargo tessera ios build -p example --profiling-output acceptance.jsonl
          rust-script scripts/check-package.rs ios target/packages/example/ios/*/example.app
      - name: Verify Apple IME and iOS application lifecycle
        run: rust-script scripts/test-apple-ime.rs target/packages/example/ios/*/example.app
      - name: Retain iOS acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-acceptance-diagnostics
          path: target/mobile-acceptance
          if-no-files-found: ignore

  check_android:
    name: Check Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
          target: aarch64-linux-android,x86_64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      - name: Build and inspect Android APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo tessera android build --format apk -p example --arch arm64
          rust-script scripts/check-package.rs android example/gen/android/app/build/outputs/apk
          cargo tessera android build --format apk -p example --arch x86_64 --profiling-output files/acceptance.jsonl
          rust-script scripts/check-package.rs android example/gen/android/app/build/outputs/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android example
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: rust-script scripts/check-mobile.rs --android example/gen/android/app/build/outputs/apk
      - name: Retain Android acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-acceptance-diagnostics
          path: target/mobile-acceptance
          if-no-files-found: ignore
