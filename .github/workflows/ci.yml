name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  TESSERA_COLOR_CHECK_TIMEOUT_SECS: 900

jobs:
  build_and_test:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, rust-src, rust-analyzer
          target: wasm32-unknown-unknown
      - name: Check all targets
        run: cargo tessera check --workspace --all-targets --verbose
      - name: Test and package example
        if: runner.os == 'Linux'
        run: |
          cargo test --workspace --verbose
          cargo install cargo-packager --locked
          cargo tessera package -p example --formats deb
      - name: Check scripts and formatting
        if: runner.os == 'Linux'
        run: |
          cargo install rust-script --locked
          rust-script --test scripts/analyze-profiler.rs
          rust-script --test scripts/check-imports.rs
          rust-script scripts/check-imports.rs --check
      - name: Package example and verify Apple IME
        if: runner.os == 'macOS'
        run: |
          cargo tessera ios build -p example
          cargo install cargo-packager --locked
          cargo tessera package -p example --formats app
          python3 scripts/test-apple-ime.py

  check_web:
    name: Check Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
          target: wasm32-unknown-unknown
      - name: Install Binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build web example
        run: cargo tessera web build --release -p example

  check_android:
    name: Check Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rust-analyzer
          target: aarch64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
      - name: Build Android example
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tessera android build --format apk -p example
