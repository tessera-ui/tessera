[package]
name = "tessera-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Platform services and plugins for Tessera."

[dependencies]
parking_lot = "0.12.5"
tessera-ui = { path = "../tessera-ui" }
tracing = "0.1.44"

[target.'cfg(all(not(target_os = "android"), not(target_family = "wasm")))'.dependencies]
arboard = "3.6.1"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.93", features = ["Clipboard", "ClipboardEvent", "DataTransfer", "Document", "Event", "EventTarget", "HtmlCanvasElement", "KeyboardEvent", "Navigator", "Window"] }
