[workspace]
resolver = "3"
members = [
    "example",
    "tessera-ui",
    "crates/tessera-foundation",
    "crates/tessera-platform",
    "crates/tessera-components",
    "crates/tessera-build",
    "crates/tessera-macros",
    "crates/tessera-shard",
    "crates/cargo-tessera",
    "crates/tessera-mobile",
    "crates/tessera-glyphon",
    "crates/tessera-cosmic-text",
    "crates/tessera-i18n",
]
exclude = ["crates/tessera-android-activity", "crates/tessera-accesskit", "crates/tessera-cosmic-text/examples", "crates/tessera-winit"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/tessera-ui/tessera"
homepage = "https://tessera-ui.github.io"

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
