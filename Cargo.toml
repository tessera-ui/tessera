[workspace]
resolver = "3"
members = [
    "example",
    "tessera-ui",
    "crates/tessera-foundation",
    "crates/tessera-platform",
    "crates/tessera-components",
    "crates/tessera-build",
    "crates/tessera-macros",
    "crates/tessera-shard",
    "crates/cargo-tessera",
    "crates/tessera-mobile",
    "crates/tessera-glyphon",
    "crates/tessera-cosmic-text",
    "crates/tessera-i18n",
]
exclude = ["crates/tessera-android-activity", "crates/tessera-accesskit", "crates/tessera-cosmic-text/examples", "crates/tessera-winit"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/tessera-ui/tessera"
homepage = "https://tessera-ui.github.io"

# Shared dependency requirements for Tessera-owned crates.
#
# - Prefer `major.minor` caret requirements unless a patch API or fix is needed;
#   CI verifies the lower bounds with `-Z direct-minimal-versions`.
# - cargo-tessera declares its own full `major.minor.patch` requirements.
# - Do not use open or upper-bounded ranges. Crates whose types are passed to
#   each other must stay on requirements that resolve to one shared version.
# - Declare `default-features = false` here when any member needs it; members
#   then opt into the features they use.
[workspace.dependencies]
bumpalo = "3.20"
tessera-build = { path = "crates/tessera-build", version = "0.1.0" }
tessera-components = { path = "crates/tessera-components", version = "2.7.0" }
tessera-foundation = { path = "crates/tessera-foundation", version = "0.1.0" }
tessera-i18n = { path = "crates/tessera-i18n", version = "0.1.0" }
tessera-macros = { path = "crates/tessera-macros", version = "0.4.4" }
tessera-platform = { path = "crates/tessera-platform", version = "0.1.0" }
tessera-shard = { path = "crates/tessera-shard", version = "0.4.2" }
tessera-ui = { path = "tessera-ui", version = "2.5.0" }
accesskit = { path = "crates/tessera-accesskit/accesskit", version = "0.25.2" }
accesskit_winit = { package = "tessera-accesskit-winit", path = "crates/tessera-accesskit/adapters/winit", version = "0.34.2" }
glyphon = { package = "tessera-glyphon", path = "crates/tessera-glyphon", version = "0.12.0" }
winit = { package = "tessera-winit", path = "crates/tessera-winit", version = "0.30.13" }

anyhow = "1.0.98"
arboard = "3.7"
bytemuck = "1.25"
colored = "3.1"
criterion = { version = "0.8.2", default-features = false, features = ["plotters", "cargo_bench_support"] }
console_error_panic_hook = "0.1"
core-foundation = "0.10"
deunicode = "1.6"
dirs = "7.0"
downcast-rs = "2.0"
duct = "1.1"
dunce = "1.0"
dyn-clone = "1.0"
embed-resource = "3.0"
# `glam` implements `encase::ShaderType` through its `encase-013` feature.
encase = "0.13"
glam = "0.34"
english-numbers = "0.3"
env_logger = "0.11"
etagere = "0.3"
fluent-bundle = "0.16"
fluent-templates = { version = "0.15", default-features = false }
futures-util = "0.3"
futures-channel = "0.3"
handlebars = "6.4"
hashbrown = { version = "0.17.1", default-features = false }
heck = "0.5"
hex = "0.4.3"
home = "0.5"
ignore = "0.4"
im = "15.1"
image = { version = "0.25", default-features = false }
include_dir = "0.7"
indextree = "4.9"
interprocess = "2.4"
java-properties = "2.0"
# `tessera-ui` re-exports `jni` types; 0.22 is a breaking API rewrite.
jni = "0.21"
js-sys = "0.3.107"
libc = "0.2.191"
log = "0.4.35"
lru = "0.19"
lyon_geom = "1.0.19"
lyon_path = "1.0.19"
lyon_tessellation = "1.0"
material-color-utilities = "1.0.0-dev.18"
memmap2 = "0.9"
ndk-context = "0.1.1"
ndk-sys = "0.6"
objc2 = { version = "0.6.5", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false }
objc2-ui-kit = { version = "0.3", default-features = false }
# 0.2.0 lacks the `byte_regex!` macro used by tessera-mobile.
once-cell-regex = "0.2.1"
os_info = "3.15"
os_pipe = "1.2.2"
parking_lot = "0.13"
path_abs = "0.5"
plist = "1.10"
pollster = "1.0.1"
# `prettyplease` formats `syn` syntax trees, so both must share a major version.
prettyplease = "0.3"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "3.0"
resvg = { version = "0.49", default-features = false }
rstest = "0.28"
rustc-hash = "2.1.3"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11"
slotmap = "1.1"
smallbox = "0.8"
smallvec = "1.16"
structopt = "0.3"
tempfile = "3.27"
textwrap = "0.16"
thiserror = "2.0.15"
tokio = "1.54"
toml = "1.2.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
ureq = { version = "3.5", default-features = false }
usvg = { version = "0.49", default-features = false }
uuid = "1.29"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
web-time = "1.1"
wgpu = "30.0.1"
which = "8.0"
windows = "0.62"
wuff = { version = "0.2", default-features = false }
x509-certificate = "0.25"

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
