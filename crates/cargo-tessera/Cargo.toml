[package]
name = "cargo-tessera"
version = "0.5.0"
edition.workspace = true
rust-version = "1.98"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI tool for Tessera UI framework - project scaffolding, development server, and build automation"
keywords = ["gui", "ui", "cli", "tessera"]
categories = ["command-line-utilities", "gui", "development-tools"]
include = ["Cargo.toml", "README.md", "src/**", "templates/**", "skills/**"]

[[bin]]
name = "cargo-tessera"
path = "src/main.rs"

# Dependency requirements written into generated projects. The release script
# updates them with the packages they name.
[package.metadata.tessera.scaffold]
tessera-build = "0.1.0"
tessera-components = "2.7.0"
tessera-foundation = "0.1.0"
tessera-ui = "2.5.0"

[dependencies]
aho-corasick = "1.1.5"
annotate-snippets = "0.12.18"
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
cargo_mobile2 = { package = "tessera-mobile", path = "../tessera-mobile", version = "0.1.0", default-features = false, features = ["native-tls"] }
clap = { version = "4.6.7", features = ["derive", "cargo"] }
comfy-table = "8.0.1"
console = "0.16.6"
csv = "1.4.0"
dirs = "7.0.0"
globset = "0.4.21"
handlebars = "6.4.4"
heck = "0.5.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
include_dir = "0.7.4"
indicatif = "0.18.6"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "editor"] }
interprocess = "2.4.8"
notify = "8.2.2"
owo-colors = "4.4.0"
plist = "1.10.3"
# These rust-analyzer crates exchange internal types and must stay on one release.
ra_ap_base_db = "=0.0.358"
ra_ap_cfg = "=0.0.358"
ra_ap_hir = "=0.0.358"
ra_ap_hir_def = "=0.0.358"
ra_ap_hir_expand = "=0.0.358"
ra_ap_ide = "=0.0.358"
ra_ap_intern = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_span = "=0.0.358"
ra_ap_syntax = "=0.0.358"
ra_ap_vfs = "=0.0.358"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
rustfix = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tessera-build = { path = "../tessera-build", version = "0.1.0" }
text-size = { version = "1.1.1", features = ["serde"] }
toml = "1.2.1"
# The rust-analyzer lexer requires these exact Unicode releases.
unicode-ident = "=1.0.24"
unicode-properties = { version = "=0.1.4", default-features = false }
unicode-width = "0.2.3"
# Keep this aligned with the workspace's wasm-bindgen for web builds.
wasm-bindgen-cli-support = "0.2.130"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tessera-foundation = { path = "../tessera-foundation", version = "0.1.0" }
tessera-ui = { path = "../../tessera-ui", version = "2.5.0" }
