[package]
name = "cargo-tessera"
version = "0.5.0"
edition.workspace = true
rust-version = "1.98"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI tool for Tessera UI framework - project scaffolding, development server, and build automation"
keywords = ["gui", "ui", "cli", "tessera"]
categories = ["command-line-utilities", "gui", "development-tools"]
include = ["Cargo.toml", "README.md", "src/**", "templates/**", "skills/**"]

[[bin]]
name = "cargo-tessera"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
annotate-snippets = "0.12.17"
anyhow = "1.0"
cargo_mobile2 = { package = "tessera-mobile", path = "../tessera-mobile", version = "0.1.0", default-features = false, features = [
    "native-tls",
] }
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive", "cargo"] }
comfy-table = "7.1"
console = "0.16.2"
csv = "1.3"
dirs = "6"
globset = "0.4"
handlebars = "6"
heck = "0.5"
include_dir = "0.7"
indicatif = "0.18.4"
inquire = { version = "0.9.3", default-features = false, features = [
    "crossterm",
    "editor",
] }
notify = "8.2.0"
owo-colors = "4.3"
plist = "1.8"
ra_ap_hir = "=0.0.358"
ra_ap_hir_def = "=0.0.358"
ra_ap_hir_expand = "=0.0.358"
ra_ap_ide = "=0.0.358"
ra_ap_base_db = "=0.0.358"
ra_ap_cfg = "=0.0.358"
ra_ap_intern = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_span = "=0.0.358"
ra_ap_syntax = "=0.0.358"
ra_ap_vfs = "=0.0.358"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.10"
text-size = { version = "1.1", features = ["serde"] }
tessera-build = { path = "../tessera-build", version = "0.1.0" }
toml = "1.1.0"
# The rust-analyzer lexer requires Unicode 17 in both Unicode dependencies.
unicode-ident = "=1.0.24"
unicode-properties = { version = "=0.1.4", default-features = false }
unicode-width = "0.2"
wasm-bindgen-cli-support = "0.2.114"
interprocess = "2.4.4"
tempfile = "3.27"
rustfix = "0.9.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tessera-ui = { path = "../../tessera-ui", version = "2.5.0" }
tessera-components = { path = "../tessera-components", version = "2.7.0" }
