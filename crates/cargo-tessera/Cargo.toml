[package]
name = "cargo-tessera"
version = "0.5.0"
edition.workspace = true
rust-version = "1.98"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI tool for Tessera UI framework - project scaffolding, development server, and build automation"
keywords = ["gui", "ui", "cli", "tessera"]
categories = ["command-line-utilities", "gui", "development-tools"]
include = ["Cargo.toml", "README.md", "src/**", "templates/**", "skills/**"]

[[bin]]
name = "cargo-tessera"
path = "src/main.rs"

[dependencies]
aho-corasick.workspace = true
annotate-snippets.workspace = true
anyhow.workspace = true
cargo_metadata.workspace = true
cargo_mobile2 = { workspace = true, features = ["native-tls"] }
clap = { workspace = true, features = ["derive", "cargo"] }
comfy-table.workspace = true
console.workspace = true
csv.workspace = true
dirs.workspace = true
globset.workspace = true
handlebars.workspace = true
heck.workspace = true
hex.workspace = true
include_dir.workspace = true
indicatif.workspace = true
inquire = { workspace = true, features = ["crossterm", "editor"] }
interprocess.workspace = true
notify.workspace = true
owo-colors.workspace = true
plist.workspace = true
ra_ap_base_db.workspace = true
ra_ap_cfg.workspace = true
ra_ap_hir.workspace = true
ra_ap_hir_def.workspace = true
ra_ap_hir_expand.workspace = true
ra_ap_ide.workspace = true
ra_ap_intern.workspace = true
ra_ap_load-cargo.workspace = true
ra_ap_project_model.workspace = true
ra_ap_span.workspace = true
ra_ap_syntax.workspace = true
ra_ap_vfs.workspace = true
ratatui = { workspace = true, features = ["crossterm", "layout-cache", "underline-color"] }
rustfix.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2.workspace = true
tempfile.workspace = true
tessera-build.workspace = true
text-size = { workspace = true, features = ["serde"] }
toml.workspace = true
unicode-ident.workspace = true
unicode-properties.workspace = true
unicode-width.workspace = true
wasm-bindgen-cli-support.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tessera-components.workspace = true
tessera-ui.workspace = true
