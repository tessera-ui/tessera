[package]
name = "tessera-i18n"
version = "0.1.0"
description = "Reactive Fluent localization for Tessera applications"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
fluent-bundle.workspace = true
fluent-templates = { workspace = true, features = ["macros", "walkdir"] }
tessera-ui.workspace = true

[dev-dependencies]
tessera-ui = { workspace = true, features = ["testing"] }
