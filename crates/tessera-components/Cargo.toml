[package]
name = "tessera-components"
version = "2.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Basic components for tessera-ui, using md3e design principles."
build = "build.rs"

[dependencies]
bytemuck.workspace = true
encase.workspace = true
etagere.workspace = true
glam = { workspace = true, features = ["encase-013"] }
glyphon.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
lru.workspace = true
lyon_geom.workspace = true
lyon_path.workspace = true
lyon_tessellation.workspace = true
material-color-utilities.workspace = true
parking_lot = { workspace = true, features = ["arc_lock"] }
smallvec.workspace = true
tessera-foundation.workspace = true
tessera-i18n.workspace = true
tessera-platform.workspace = true
tessera-ui.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
usvg.workspace = true
wuff = { workspace = true, features = ["brotli"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Response", "Window"] }

[build-dependencies]
tessera-build.workspace = true

[dev-dependencies]
tessera-ui = { workspace = true, features = ["testing", "headless"] }
