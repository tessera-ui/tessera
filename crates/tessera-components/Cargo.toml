[package]
name = "tessera-components"
version = "2.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Basic components for tessera-ui, using md3e design principles."
build = "build.rs"

[dependencies]
tessera-font-noto-sans-sc = { path = "../tessera-font-noto-sans-sc", version = "0.1.0" }
tessera-font-noto-color-emoji = { path = "../tessera-font-noto-color-emoji", version = "0.1.0" }
bytemuck = "1.24.0"
image = { version = "0.25.9", default-features = false, features = [
    "png",
    "jpeg",
] }
glyphon = { package = "tessera-glyphon", version = "0.12.0", path = "../tessera-glyphon" }
tracing = "0.1.44"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
tessera-foundation = { path = "../tessera-foundation", version = "0.1.0" }
tessera-ui = { path = "../../tessera-ui", version = "2.5.0" }
tessera-i18n = { path = "../tessera-i18n", version = "0.1.0" }
tessera-platform = { path = "../tessera-platform", version = "0.1.0" }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12.0"
encase = "0.12.0"
glam = { version = "0.32.0", features = ["encase"] }
lru = "0.16.3"
smallvec = "1.15.1"
usvg = { version = "0.47.0", default-features = false }
lyon_path = "1.0.16"
lyon_tessellation = "1.0.16"
thiserror = "2.0.18"
lyon_geom = "1.0.18"
material-color-utilities = "1.0.0-dev.18"

[build-dependencies]
tessera-build = { path = "../tessera-build", version = "0.1.0" }

[dev-dependencies]
tessera-ui = { path = "../../tessera-ui", features = ["testing", "headless"], version = "2.5.0" }
