[package]
name = "tessera-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Platform services and plugins for Tessera."

[dependencies]
parking_lot.workspace = true
tessera-ui.workspace = true
tracing.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_family = "wasm")))'.dependencies]
arboard.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Clipboard", "ClipboardEvent", "DataTransfer", "Document", "Event", "EventTarget", "HtmlCanvasElement", "KeyboardEvent", "Navigator", "Window"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSString"] }
objc2-ui-kit = { workspace = true, features = ["UIPasteboard"] }
