[package]
name = "tessera-mobile"
version = "0.1.0"
authors = [
  "Tauri Programme within The Commons Conservancy",
  "Brainium Studios LLC",
  "Francesca Lovebloom <francesca@brainiumstudios.com>",
  "Tessera contributors",
]
edition.workspace = true
description = "Rust on mobile made easy."
repository = "https://github.com/tessera-ui/tessera"
keywords = ["mobile", "ios", "android", "tessera"]
categories = ["development-tools"]
license = "Apache-2.0 OR MIT"

[package.metadata.docs.rs]
no-default-features = true
features = ["native-tls"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
]

[lib]
name = "cargo_mobile2"
path = "src/lib.rs"

[[bin]]
name = "cargo-mobile"
required-features = ["cli"]

[[bin]]
name = "cargo-apple"
required-features = ["cli"]

[[bin]]
name = "cargo-android"
required-features = ["cli"]

[features]
cli = [
  "home",
  "dunce",
  "handlebars",
  "log",
  "serde",
  "serde_json",
  "thiserror",
  "structopt",
  "env_logger",
  "dep:embed-resource",
]
brainium = []
rustls = ["ureq/rustls"]
native-tls = ["ureq/native-tls"]
default = ["cli", "native-tls"]

[dependencies]
colored.workspace = true
deunicode.workspace = true
duct.workspace = true
dunce.workspace = true
english-numbers.workspace = true
env_logger = { workspace = true, optional = true }
handlebars.workspace = true
heck.workspace = true
home.workspace = true
ignore.workspace = true
include_dir.workspace = true
java-properties.workspace = true
log.workspace = true
once-cell-regex.workspace = true
os_pipe.workspace = true
path_abs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
structopt = { workspace = true, optional = true }
textwrap = { workspace = true, features = ["terminal_size"] }
thiserror.workspace = true
toml = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
rstest.workspace = true

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation.workspace = true
os_info.workspace = true
plist.workspace = true
x509-certificate.workspace = true

[target."cfg(not(target_os = \"macos\"))".dependencies]
ureq = { workspace = true, features = ["gzip"] }

[target."cfg(unix)".dependencies]
libc.workspace = true

[target."cfg(windows)".dependencies]
which.workspace = true

[target."cfg(windows)".dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
]

[target."cfg(windows)".build-dependencies]
embed-resource = { workspace = true, optional = true }

[build-dependencies]
dunce = { workspace = true, optional = true }
handlebars = { workspace = true, optional = true }
home = { workspace = true, optional = true }
log = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
