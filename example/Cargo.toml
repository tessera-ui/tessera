[package]
name = "example"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]
name = "example_lib"
path = "src/lib.rs"

[[bin]]
name = "example"
path = "src/main.rs"

[features]
md3-diagnostics = []

[dependencies]
tessera-components.workspace = true
tessera-foundation.workspace = true
tessera-i18n.workspace = true
tessera-platform.workspace = true
tessera-shard.workspace = true
tessera-ui = { workspace = true, features = ["headless"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true

[build-dependencies]
tessera-build.workspace = true

[dev-dependencies]
tessera-ui = { workspace = true, features = ["testing"] }
