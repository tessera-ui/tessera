# XcodeGen specification used once by `cargo tessera apple init`. The generated
# Xcode project belongs to you: edit it in Xcode. Regenerate it with
# `cargo tessera apple init --force`, which replaces local changes.
name: example
options:
  deploymentTarget:
    iOS: "15.0"
    macOS: "11.0"
  createIntermediateGroups: true
configFiles:
  Debug: tessera.xcconfig
  Release: tessera.xcconfig
settings:
  base:
    PRODUCT_NAME: example
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    # cargo reads the workspace and writes its target directory.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  example-iOS:
    type: application
    platform: iOS
    sources:
      - path: Tessera.xcassets
    settings:
      base:
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    postCompileScripts:
      - name: Build Rust
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../.." && cargo tessera apple rust-build
    scheme: {}
  example-macOS:
    type: application
    platform: macOS
    sources:
      - path: Tessera.xcassets
    settings:
      base:
        INFOPLIST_FILE: macOS/Info.plist
    postCompileScripts:
      - name: Build Rust
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../.." && cargo tessera apple rust-build
    scheme: {}
