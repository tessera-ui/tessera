
[package]
name = "tessera-ui"
version = "2.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A cross-platform declarative & functional UI library for rust, focused on performance and extensibility."
readme = "../README.md"

[features]
default = []
profiling = ["serde", "serde_json", "interprocess"]
debug-dirty-overlay = []
testing = []
headless = ["serde", "serde_json", "wgpu/counters"]

[dependencies]
bumpalo.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
dirs.workspace = true
downcast-rs.workspace = true
dyn-clone.workspace = true
hashbrown.workspace = true
im.workspace = true
indextree.workspace = true
interprocess = { workspace = true, optional = true }
pollster.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
slotmap.workspace = true
smallbox.workspace = true
smallvec.workspace = true
tessera-macros.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "js"] }
wgpu.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
parking_lot = { workspace = true, features = ["deadlock_detection"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "io-util"] }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "smallvec", "std", "tracing-log"] }

[target.'cfg(not(any(target_family = "wasm", target_os = "android")))'.dependencies]
memmap2.workspace = true

[target.'cfg(target_family = "unix")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-foundation = { workspace = true, features = ["NSString", "NSUserDefaults"] }
objc2-quartz-core = { workspace = true, features = [
    "CALayer",
    "objc2-core-foundation",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
winit.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
parking_lot.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "tracing-log"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["console", "CssStyleDeclaration", "Document", "Element", "HtmlCanvasElement", "Window", "Response", "Url", "HtmlElement", "Event", "EventTarget", "DomRect", "VisualViewport"] }
web-time.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true
ndk-sys.workspace = true
winit = { workspace = true, features = ["android-game-activity"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
objc2-ui-kit = { workspace = true, features = ["UIGeometry", "UIView", "UIResponder", "UIKeyboardLayoutGuide", "UILayoutGuide", "UITrackingLayoutGuide", "objc2-core-foundation"] }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "slot_table"
harness = false
required-features = ["testing"]

[[bench]]
name = "component_call"
harness = false
required-features = ["testing"]
