
[package]
name = "tessera-ui"
version = "2.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A cross-platform declarative & functional UI library for rust, focused on performance and extensibility."
readme = "../README.md"

[features]
default = []
profiling = ["serde", "serde_json", "interprocess"]
debug-dirty-overlay = []
testing = []
headless = ["serde", "serde_json"]

[dependencies]
uuid = { version = "1.26.1", features = ["v4", "js"] }
bytemuck = { version = "1.24.0", features = ["derive"] }
tracing = "0.1.44"
pollster = "0.4.0"
wgpu = "30.0.1"
indextree = "4.7.4"
slotmap = "1.1.1"
rustc-hash = "2.1.1"
tessera-macros = { path = "../crates/tessera-macros", version = "0.4.4" }
accesskit = { version = "0.25.2", path = "../crates/tessera-accesskit/accesskit" }
accesskit_winit = { package = "tessera-accesskit-winit", version = "0.34.2", path = "../crates/tessera-accesskit/adapters/winit" }
smallvec = "1.15.1"
downcast-rs = "2.0.2"
dyn-clone = "1.0.20"
dirs = "6.0.0"
im = "15.1.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
interprocess = { version = "2.4.4", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }

[target.'cfg(target_family = "unix")'.dependencies]
libc = "0.2.185"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSResponder",
    "NSView",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "CALayer",
    "objc2-core-foundation",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = { package = "tessera-winit", version = "0.30.13", path = "../crates/tessera-winit" }

[target.'cfg(target_family = "wasm")'.dependencies]
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "tracing-log"] }
parking_lot = "0.12.5"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.93"
wasm-bindgen = "0.2.116"
web-sys = { version = "0.3.93", features = ["console", "CssStyleDeclaration", "Document", "Element", "HtmlCanvasElement", "Window", "Response", "Url", "HtmlElement", "Event", "EventTarget", "DomRect", "VisualViewport"] }
wasm-bindgen-futures = "0.4.55"
web-time = "1.1.0"

[target.'cfg(target_os = "android")'.dependencies]
winit = { package = "tessera-winit", version = "0.30.13", path = "../crates/tessera-winit", features = ["android-game-activity"] }
ndk-sys = "0.6.0"
jni = "0.21.1"
ndk-context = "0.1.1"

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6.3", default-features = false }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIGeometry", "UIView", "UIResponder", "UIKeyboardLayoutGuide", "UILayoutGuide", "UITrackingLayoutGuide", "objc2-core-foundation"] }
